name: 🤖 AI Daily Digest

on:
  schedule:
    # Corre cada día de lunes a viernes a las 8:00 AM (hora Ciudad de Guatemala / UTC-6)
    # En UTC eso es las 14:00
    - cron: "0 14 * * 1-5"

  # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependencias
        run: pip install anthropic

      - name: 🚀 Generar y enviar digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python generate_digest.py
